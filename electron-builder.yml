appId: dev.orrery.app
productName: Orrery
copyright: Copyright © Iskandar Putra and Orrery contributors
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - '!**/*.map'
  # The PDF and OCR engines ship as copies beside index.html, put there by
  # scripts/sync-assets.mjs, and the renderer bundles the JavaScript it uses at
  # build time. The packages themselves would ride along as a second copy —
  # nearly sixty megabytes of it — so what the app does not load at runtime is
  # left out.
  #
  # Kept deliberately: `pdfjs-dist/legacy` and its data, which the main process
  # loads to read a PDF's text, and all of `@embedpdf/pdfium`, whose wasm is
  # read from node_modules when a document's pages are rearranged.
  - '!node_modules/tesseract.js-core/**'
  - '!node_modules/@tesseract.js-data/**'
  - '!node_modules/pdfjs-dist/{web,build,image_decoders,iccs,types}/**'
asar: true
# The sidecar is an executable, so it cannot live inside the asar — it is copied
# alongside it and found through process.resourcesPath. Absent when the Rust
# toolchain was not available at build time; the app falls back to TypeScript.
extraResources:
  - from: resources/sidecar
    to: sidecar
    filter: ['**/*']
  # The stdio bridge is a program another client launches, so it has to be a
  # real file on disk rather than something inside the asar.
  - from: resources/mcp-stdio-bridge.mjs
    to: mcp-stdio-bridge.mjs
  # Shipped with the app, not only kept in the repository: the fonts are under
  # the SIL Open Font License, which asks that its text and the copyright
  # notices travel with anything the font is bundled into.
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: licenses
    to: licenses
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
  synopsis: A fast, friendly markdown editor and knowledge base
  description: >-
    orrery is a high-performance markdown editor with live preview, wikilinks,
    backlinks, a graph view, math and diagrams, and an optional AI assistant.
  maintainer: orrery contributors <noreply@orrery.co>
  desktop:
    entry:
      Name: orrery
      Comment: Markdown editor and knowledge base
      Categories: Office;TextEditor;Utility;
      Keywords: markdown;notes;editor;knowledge;
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
mac:
  icon: build/icon.png
  category: public.app-category.productivity
win:
  icon: build/icon.png
  target: nsis
