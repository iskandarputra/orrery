<!doctype html>
<html lang="en" data-theme="zinc-dark">
  <head>
    <meta charset="UTF-8" />
    <title>Orrery</title>
    <!--
      `orrery-asset:` is the app's read-only view of the disk. It appears in
      style-src and font-src for the HTML reader: a page rendered in the
      sandboxed frame inherits this policy as well as its own, and the two
      intersect, so a stylesheet or a webfont sitting next to the file being
      read cannot load unless it is allowed *here* too. Nothing in the app's own
      document loads that way — a note cannot produce a `<link>` or a `<style>`;
      `core/html-policy` does not allow either tag.

      There is deliberately no `frame-src`. It falls back to `default-src
      'self'`, which is what stops a link inside a previewed page from
      navigating that frame off the document the app built and onto a live one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' orrery-asset:; img-src 'self' data: https: orrery-asset:; font-src 'self' data: orrery-asset:; connect-src 'self' ws://localhost:* orrery-asset:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
