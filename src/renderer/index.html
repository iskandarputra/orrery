<!doctype html>
<html lang="en" data-theme="zinc-dark">
  <head>
    <meta charset="UTF-8" />
    <title>Orrery</title>
    <!--
      This is the application's own policy and nothing else's. It used to be
      the HTML reader's as well: a `srcdoc` frame inherits the CSP of the page
      embedding it, so a stylesheet or a webfont sitting next to a file being
      read could not load unless it was allowed *here* too, and style-src and
      font-src carried `orrery-asset:` for that reason alone. A page fetched
      over `orrery-preview:` inherits nothing, so those two are gone again and
      the app is back to loading its styles and fonts from itself. What the
      reader may load is decided in `core/html-document`, per document.

      `orrery-asset:` stays in img-src and connect-src, where the app's own
      surfaces use it: a picture in a note, a PDF read straight off the disk.

      `frame-src` names exactly one scheme, and it has to. The HTML reader shows
      a page by navigating a frame to `orrery-preview:`, which main serves from
      memory with a policy of its own — and without a `frame-src` that
      navigation falls back to `default-src 'self'` and is refused. Naming the
      one scheme is also what keeps a *link* inside a previewed page inert: a
      click on an `https:` or `orrery-asset:` address still matches nothing
      here, so the frame cannot be navigated off the document the app built.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: orrery-asset:; font-src 'self' data:; connect-src 'self' ws://localhost:* orrery-asset:; frame-src orrery-preview:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
